name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate Python sources compile
        run: python -m compileall -q backend start.py tests scripts
      - name: Test critical imports
        run: python -c "import pandas, numpy, cryptography, chromadb, fastapi, pydantic, sqlalchemy; print('All critical packages imported successfully.')"
      - name: Run tests
        env:
          TEST_MODE: "1"
        run: python -m pytest tests -v --timeout=60 --ignore=tests/manual
      - name: Validate browser scripts
        if: matrix.os != 'windows-latest'
        run: node --check frontend/js/app.js
      - name: Validate browser scripts (Windows)
        if: matrix.os == 'windows-latest'
        run: node --check frontend/js/app.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: pip install bandit safety
      - name: Bandit (static analysis)
        run: bandit -r backend/ -f json -o bandit-report.json || true
      - name: Safety (dependency vulnerabilities)
        run: safety check --json --output safety-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: '*'-report.json